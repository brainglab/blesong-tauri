<dialog class="modal" [class.modal-open]="mShow">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-2">
      <h3 class="text-lg font-bold">
        @switch (mClassType) {
          @case ('success') { <span class="text-success">✓</span> }
          @case ('warning') { <span class="text-warning">!</span> }
          @case ('danger')  { <span class="text-error">!</span> }
          @case ('info')    { <span class="text-info">i</span> }
        }
        {{ mTitle }}
      </h3>
      <button type="button" class="btn btn-sm btn-circle btn-ghost" (click)="close(false)" aria-label="Cerrar">✕</button>
    </div>

    <p class="py-4">{{ mText }}</p>

    <div class="modal-action">
      <button type="button" class="btn btn-neutral" (click)="close(false)">No</button>
      <button type="button" class="btn btn-primary" (click)="close(true)">Sí</button>
    </div>
  </div>
  <div class="modal-backdrop" (click)="close(false)"></div>
</dialog>
