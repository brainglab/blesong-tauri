<div (click)="close()" [class]="'alert alert-' + mClassType" [ngClass]="mShow ? 'animate__animated animate__tada' : 'animate__animated animate__zoomOut'" role="alert">

  @if (mClassType == 'success') {
    <i [class]="'fa-solid fa-circle-check me-2'" style="font-size: 20px;"></i>
  }
  @if (mClassType == 'info') {
    <i [class]="'fa-solid fa-circle-info me-2'" style="font-size: 20px;"></i>
  }
  @if (mClassType == 'warning') {
    <i [class]="'fa-solid fa-circle-exclamation me-2'" style="font-size: 20px;"></i>
  }
  @if (mClassType == 'danger') {
    <i [class]="'fa-solid fa-triangle-exclamation me-2'" style="font-size: 20px;"></i>
  }

  {{ mText }}
</div>
