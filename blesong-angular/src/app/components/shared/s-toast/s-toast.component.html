<div role="alert"
     [class]="'alert shadow-lg transition-opacity duration-300 ' + (
       mClassType === 'success' ? 'alert-success' :
       mClassType === 'info' ? 'alert-info' :
       mClassType === 'warning' ? 'alert-warning' :
       mClassType === 'danger' ? 'alert-error' : 'alert')"
     [class.opacity-0]="!mShow"
     [class.opacity-100]="mShow"
     (click)="close()">
  @switch (mClassType) {
    @case ('success') { <span class="font-bold">✓</span> }
    @case ('info')    { <span class="font-bold">i</span> }
    @case ('warning') { <span class="font-bold">!</span> }
    @case ('danger')  { <span class="font-bold">⚠</span> }
  }
  <span>{{ mText }}</span>
</div>
