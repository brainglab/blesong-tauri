<dialog class="modal" [class.modal-open]="mShow">
  <div class="modal-box max-w-lg">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-lg font-bold">{{ mTitle }}</h3>
      <button type="button" class="btn btn-sm btn-circle btn-ghost" (click)="close(null)" aria-label="Cerrar">
        <i-lucide name="x" class="size-4"></i-lucide>
      </button>
    </div>

    <fieldset class="fieldset mb-3">
      <legend class="fieldset-legend">Buscar</legend>
      <div class="join w-full">
        <span class="btn btn-ghost join-item pointer-events-none">
          <i-lucide name="search" class="size-4"></i-lucide>
        </span>
        <input
          #mSearchInput
          type="text"
          class="input input-bordered join-item flex-1"
          [(ngModel)]="mSearchText"
          placeholder="Buscar..."
          (keyup)="filterOptions()" />
      </div>
    </fieldset>

    <div class="overflow-y-auto max-h-80 border border-base-300 rounded-box">
      <table class="table table-hover m-0">
        <tbody>
          @if (mFilteredOptions?.length === 0) {
            <tr>
              <td class="text-center py-6 opacity-60">No hay registros disponibles</td>
            </tr>
          }

          @for (mOption of mFilteredOptions; track mOption) {
            <tr class="cursor-pointer hover" (click)="close(mOption.idx)">
              <td>
                <div class="flex items-center justify-between gap-3">
                  <div>
                    <div class="font-medium">{{ mOption.name }}</div>
                    @if (mOption.description) {
                      <div class="text-xs opacity-60">{{ mOption.description }}</div>
                    }
                  </div>
                  <i-lucide name="chevron-right" class="size-4 opacity-50"></i-lucide>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="modal-action">
      <button type="button" class="btn btn-ghost btn-sm" (click)="close(null)">Cancelar</button>
    </div>
  </div>
  <div class="modal-backdrop" (click)="close(null)"></div>
</dialog>
