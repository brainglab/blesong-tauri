<form autocomplete="off" [formGroup]="mForm" (ngSubmit)="search()" #f="ngForm" class="space-y-4">

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Nombre</legend>
      <input
        class="input input-bordered w-full"
        [class.input-error]="mAutorNameValid"
        autocomplete="off"
        id="autor_name"
        type="text"
        formControlName="autor_name"
        [(ngModel)]="mAutor.autor_name"
        placeholder="Nombre..." />
      @if (mAutorNameValid) {
        @if (mForm.get('autor_name').errors.maxlength) {
          <p class="fieldset-label text-error">Debe tener como máximo 255 caracteres</p>
        }
        @if (mForm.get('autor_name').errors.pattern) {
          <p class="fieldset-label text-error">Campo no válido</p>
        }
      }
    </fieldset>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <fieldset class="fieldset">
      <legend class="fieldset-legend">Ordenar por</legend>
      <div class="join w-full">
        <input class="input input-bordered join-item flex-1" type="text"
               formControlName="order_field" [(ngModel)]="mOptionOrderText['order_field']"
               placeholder="Ordenar por..." readonly />
        <button class="btn btn-soft join-item" type="button" aria-label="Limpiar"
                (click)="showModalOptionOrder('Seleccione campo', mOptionOrderField, 'order_field', true)">
          <i-lucide name="x" class="size-4"></i-lucide>
        </button>
        <button class="btn btn-primary join-item" type="button" aria-label="Elegir campo"
                (click)="showModalOptionOrder('Seleccione campo', mOptionOrderField, 'order_field')">
          <i-lucide name="chevron-down" class="size-4"></i-lucide>
        </button>
      </div>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Dirección</legend>
      <div class="join w-full">
        <input class="input input-bordered join-item flex-1" type="text"
               formControlName="order_direction" [(ngModel)]="mOptionOrderText['order_direction']"
               placeholder="Dirección..." readonly />
        <button class="btn btn-soft join-item" type="button" aria-label="Limpiar"
                (click)="showModalOptionOrder('Seleccione dirección', mOptionOrderDirection, 'order_direction', true)">
          <i-lucide name="x" class="size-4"></i-lucide>
        </button>
        <button class="btn btn-primary join-item" type="button" aria-label="Elegir dirección"
                (click)="showModalOptionOrder('Seleccione dirección', mOptionOrderDirection, 'order_direction')">
          <i-lucide name="chevron-down" class="size-4"></i-lucide>
        </button>
      </div>
    </fieldset>

    <fieldset class="fieldset">
      <legend class="fieldset-legend">Mostrar</legend>
      <div class="join w-full">
        <input class="input input-bordered join-item flex-1" type="text"
               formControlName="order_count" [(ngModel)]="mOptionOrderText['order_count']"
               placeholder="Registros..." readonly />
        <button class="btn btn-soft join-item" type="button" aria-label="Limpiar"
                (click)="showModalOptionOrder('Seleccione registros', mOptionOrderCount, 'order_count', true)">
          <i-lucide name="x" class="size-4"></i-lucide>
        </button>
        <button class="btn btn-primary join-item" type="button" aria-label="Elegir registros"
                (click)="showModalOptionOrder('Seleccione registros', mOptionOrderCount, 'order_count')">
          <i-lucide name="chevron-down" class="size-4"></i-lucide>
        </button>
      </div>
    </fieldset>
  </div>

  <div class="flex justify-end gap-2">
    <button class="btn btn-sm btn-soft" type="button" (click)="clear()">Limpiar</button>
    <button class="btn btn-sm btn-primary" type="submit">
      <i-lucide name="search" class="size-4"></i-lucide>
      Buscar
    </button>
  </div>
</form>
