<app-page-header
  eyebrow="Autor"
  [title]="mAutor.autor_name || 'Autor'">
  <button class="btn btn-sm btn-soft" type="button" backButton>
    <i-lucide name="chevron-left" class="size-4"></i-lucide>
    Volver
  </button>
  <a class="btn btn-sm btn-primary" [routerLink]="['/autors/edit', mAutor.idx]">
    <i-lucide name="pencil" class="size-4"></i-lucide>
    Editar
  </a>
</app-page-header>

<div class="px-4 sm:px-6 lg:px-8 py-6 max-w-2xl">
  <dl class="grid grid-cols-[140px_1fr] gap-y-4 gap-x-6 text-sm">
    <dt class="opacity-60">Creación</dt>
    <dd class="text-xs opacity-80 font-mono">{{ mAutor.createdAt | date:'dd/MM/yyyy HH:mm' }}</dd>

    <dt class="opacity-60">Actualización</dt>
    <dd class="text-xs opacity-80 font-mono">{{ mAutor.updatedAt | date:'dd/MM/yyyy HH:mm' }}</dd>
  </dl>
</div>
