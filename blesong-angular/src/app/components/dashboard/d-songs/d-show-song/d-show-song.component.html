<div class="flex min-h-screen bg-base-100">
  <app-d-sidebar mController="songs" />

  <div class="flex-1 flex flex-col">
    <app-d-navbar />

    <main class="p-6 max-w-5xl w-full mx-auto">
      <div class="flex items-center justify-between border-b border-base-300 pb-3 mb-6">
        <h1 class="text-2xl font-bold">Canción</h1>
      </div>

      <div class="card bg-base-100 border border-base-300 shadow-sm">
        <div class="card-body p-0">
          <div class="px-6 pt-6">
            <h2 class="card-title text-lg">Datos generales</h2>
          </div>

          <div class="overflow-x-auto">
            <table class="table">
              <tbody>
                <tr>
                  <th class="w-40">Nombre</th>
                  <td>{{ mSong.song_name }}</td>
                </tr>
                <tr>
                  <th>Autor</th>
                  <td>{{ mAutor.autor_name }}</td>
                </tr>
                <tr>
                  <th>Año</th>
                  <td>{{ mSong.song_year }}</td>
                </tr>
                <tr>
                  <th>Contenido</th>
                  <td>
                    <div [innerHtml]="mSong.song_content | encapsulationHtml"></div>
                  </td>
                </tr>
                <tr>
                  <th>Creación</th>
                  <td>{{ mSong.createdAt | date:'dd/MM/yyyy HH:mm:ss':'+0000' }}</td>
                </tr>
                <tr>
                  <th>Actualización</th>
                  <td>{{ mSong.updatedAt | date:'dd/MM/yyyy HH:mm:ss':'+0000' }}</td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="flex justify-end gap-2 px-6 py-4 border-t border-base-300">
            <button class="btn btn-neutral" backButton>Volver</button>
            <a class="btn btn-primary" [routerLink]="['/songs/edit', mSong.idx]">Editar</a>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
