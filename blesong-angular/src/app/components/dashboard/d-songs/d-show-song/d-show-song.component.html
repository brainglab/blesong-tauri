<app-page-header
  eyebrow="Canción"
  [title]="mSong.song_name || 'Canción'">
  <button class="btn btn-sm btn-soft" type="button" backButton>
    <i-lucide name="chevron-left" class="size-4"></i-lucide>
    Volver
  </button>
  <a class="btn btn-sm btn-primary" [routerLink]="['/songs/edit', mSong.idx]">
    <i-lucide name="pencil" class="size-4"></i-lucide>
    Editar
  </a>
</app-page-header>

<div class="px-4 sm:px-6 lg:px-8 py-6 max-w-4xl">
  <dl class="grid grid-cols-[140px_1fr] gap-y-4 gap-x-6 text-sm">
    <dt class="opacity-60">Autor</dt>
    <dd class="font-medium">{{ mAutor?.autor_name || '—' }}</dd>

    <dt class="opacity-60">Año</dt>
    <dd>{{ mSong.song_year || '—' }}</dd>

    <dt class="opacity-60">Creación</dt>
    <dd class="text-xs opacity-80 font-mono">{{ mSong.createdAt | date:'dd/MM/yyyy HH:mm' }}</dd>

    <dt class="opacity-60">Actualización</dt>
    <dd class="text-xs opacity-80 font-mono">{{ mSong.updatedAt | date:'dd/MM/yyyy HH:mm' }}</dd>
  </dl>

  <h2 class="text-sm font-semibold uppercase tracking-wider opacity-60 mt-10 mb-3">Letra</h2>
  <div class="rounded-xl border border-base-300 bg-base-200/30 p-6 text-[15px] leading-relaxed whitespace-pre-wrap"
       [innerHtml]="mSong.song_content | encapsulationHtml"></div>
</div>
