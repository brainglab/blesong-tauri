<div class="card bg-base-100 border border-base-300 shadow-sm mb-3">
  <div class="card-body items-center">
    <img src="assets/images/logo.png" alt="Logo de la aplicación" class="max-h-20" />
  </div>
</div>

<div class="card bg-base-100 border border-base-300 shadow-sm mb-3">
  <div class="card-body">
    <p class="text-sm opacity-70">Puedes copiar el enlace directamente:</p>
    <div class="join w-full">
      <input type="text" class="input input-bordered join-item flex-1" [value]="mCurrentUrl" readonly />
      <button class="btn btn-primary join-item" type="button" (click)="mCopyToClipboard()">Copiar</button>
    </div>
  </div>
</div>

<div class="card bg-base-100 border border-base-300 shadow-sm">
  <div class="card-body items-center text-center">
    <h3 class="card-title">O escanea el código QR</h3>
    <div class="flex justify-center my-4">
      <qrcode
              [qrdata]="mCurrentUrl"
              [allowEmptyString]="true"
              [width]="256"
              [errorCorrectionLevel]="'M'">
      </qrcode>
    </div>
    <p class="opacity-70">Escanea el código QR para ver el menú desde tu dispositivo móvil</p>
  </div>
</div>
