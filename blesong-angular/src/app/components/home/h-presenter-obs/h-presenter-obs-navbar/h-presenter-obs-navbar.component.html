<nav class="navbar sticky top-0 z-30 bg-base-100 border-b border-base-300 px-4">
  <div class="flex-1">
    <a routerLink="/presenter/qr-menu" class="btn btn-ghost btn-sm normal-case">
      <img src="assets/images/logo.png" alt="Logo" class="h-7" />
    </a>
  </div>

  <div class="flex gap-2">
    <button class="btn btn-sm btn-neutral" (click)="sendStandBy()">
      <i-lucide name="coffee" class="size-4"></i-lucide>
      Descanso
    </button>

    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-square btn-sm btn-primary" aria-label="Opciones OBS">
        <i-lucide name="menu" class="size-4"></i-lucide>
      </div>

      <div tabindex="0" class="dropdown-content card card-compact bg-base-100 shadow-xl w-80 z-50 mt-2">
        <div class="card-body gap-4">

          <div>
            <h3 class="text-sm font-semibold opacity-70 mb-2">Navegación</h3>
            <div class="grid grid-cols-2 gap-2">
              <a routerLink="/presenter/obs-letters" class="btn btn-outline btn-sm justify-start">
                <i-lucide name="music" class="size-4"></i-lucide>
                Letras
              </a>
              <a routerLink="/presenter/obs-bible" class="btn btn-outline btn-sm justify-start">
                <i-lucide name="file-text" class="size-4"></i-lucide>
                Biblia
              </a>
            </div>
          </div>

          <div>
            <h3 class="text-sm font-semibold opacity-70 mb-2">OBS</h3>
            <button class="btn btn-outline btn-sm w-full justify-start" (click)="reload()">
              <i-lucide name="refresh-cw" class="size-4"></i-lucide>
              Recargar
            </button>
          </div>

          <div>
            <h3 class="text-sm font-semibold opacity-70 mb-2">
              Tamaño de letra <span class="badge badge-sm">{{ mTemplate.template_body_fontsize }}</span>
            </h3>
            <div class="join w-full">
              <button class="btn btn-outline btn-sm join-item flex-1" (click)="setFontSize('sub')">
                <i-lucide name="minus" class="size-4"></i-lucide>
              </button>
              <button class="btn btn-outline btn-sm join-item flex-1" (click)="setFontSize('add')">
                <i-lucide name="plus" class="size-4"></i-lucide>
              </button>
            </div>
          </div>

          <div>
            <h3 class="text-sm font-semibold opacity-70 mb-2">Animación</h3>
            <ul class="menu menu-sm bg-base-200 rounded-box w-full">
              <li>
                <a (click)="setAnimation(0)" [class.menu-active]="mTemplate.template_animation === 0">
                  <i-lucide name="sparkles" class="size-4"></i-lucide>
                  Suave
                </a>
              </li>
              <li>
                <a (click)="setAnimation(1)" [class.menu-active]="mTemplate.template_animation === 1">
                  <i-lucide name="sparkles" class="size-4"></i-lucide>
                  Brillante
                </a>
              </li>
              <li>
                <a (click)="setAnimation(2)" [class.menu-active]="mTemplate.template_animation === 2">
                  <i-lucide name="sparkles" class="size-4"></i-lucide>
                  Desvanecimiento
                </a>
              </li>
              <li>
                <a (click)="setAnimation(3)" [class.menu-active]="mTemplate.template_animation === 3">
                  <i-lucide name="sparkles" class="size-4"></i-lucide>
                  Desvanecimiento con brillo
                </a>
              </li>
            </ul>
          </div>

        </div>
      </div>
    </div>
  </div>
</nav>
