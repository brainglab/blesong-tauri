<div class="flex h-screen overflow-hidden bg-base-100 text-base-content">

  <!-- ============================================ Permanent left sidebar (lg+) -->
  <aside class="hidden lg:flex w-64 shrink-0 flex-col bg-base-200 border-r border-base-300">
    <a routerLink="/songs" class="flex items-center gap-2.5 h-14 px-5 border-b border-base-300 shrink-0">
      <img src="assets/images/logo.png" alt="" class="h-6 w-auto" />
      <span class="font-semibold tracking-tight text-[15px]">Blesong</span>
    </a>
    <ng-container *ngTemplateOutlet="navTpl"></ng-container>
    <ng-container *ngTemplateOutlet="statusTpl"></ng-container>
  </aside>

  <!-- ============================================ Main column -->
  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <!-- Mobile-only topbar with right-side hamburger -->
    <header
      class="lg:hidden sticky top-0 z-20 flex items-center gap-3 h-14 px-3 bg-base-100 border-b border-base-300">
      <button type="button" (click)="mDrawerOpen.set(true)" class="btn btn-square btn-soft btn-sm"
        aria-label="Abrir menú">
        <i-lucide name="menu" class="size-5"></i-lucide>
      </button>
      <a routerLink="/songs" class="flex items-center gap-2">
        <img src="assets/images/logo.png" alt="" class="h-6 w-auto" />
      </a>
      <div class="ml-auto">
        <app-h-presenter-obs-navbar />
      </div>
    </header>

    <main class="flex-1 overflow-auto">
      <router-outlet />
    </main>
  </div>

  <!-- ============================================ Mobile right-side offcanvas -->
  <div class="lg:hidden fixed inset-0 z-50 transition-opacity duration-300" [class.opacity-100]="mDrawerOpen()"
    [class.opacity-0]="!mDrawerOpen()" [class.pointer-events-none]="!mDrawerOpen()">
    <div class="absolute inset-0 bg-black/50" (click)="mDrawerOpen.set(false)"></div>
    <aside
      class="absolute left-0 top-0 h-full w-72 max-w-[85vw] flex flex-col bg-base-200 border-r border-base-300 shadow-2xl transition-transform duration-300"
      [class.translate-x-0]="mDrawerOpen()" [class.-translate-x-full]="!mDrawerOpen()">
      <div class="flex items-center justify-between h-14 px-5 border-b border-base-300 shrink-0">
        <div class="flex items-center gap-2.5">
          <img src="assets/images/logo.png" alt="" class="h-6 w-auto" />
        </div>
        <button type="button" (click)="mDrawerOpen.set(false)" class="btn btn-square btn-soft btn-sm"
          aria-label="Cerrar menú">
          <i-lucide name="x" class="size-5"></i-lucide>
        </button>
      </div>
      <ng-container *ngTemplateOutlet="navTpl"></ng-container>
      <ng-container *ngTemplateOutlet="statusTpl"></ng-container>
    </aside>
  </div>

</div>

<!-- ============================================ Shared nav template -->
<ng-template #navTpl>
  <nav class="flex-1 overflow-y-auto px-3 py-5 space-y-6 text-sm">

    <div>
      <p class="px-2 mb-2 text-[10px] font-semibold uppercase tracking-[0.08em] opacity-50">Biblioteca</p>
      <ul class="space-y-0.5">
        <li>
          <a routerLink="/songs" routerLinkActive="bg-base-300 !opacity-100" [routerLinkActiveOptions]="{exact:false}"
            class="flex items-center gap-3 px-2.5 py-1.5 rounded-md font-medium opacity-75 hover:opacity-100 hover:bg-base-300 transition">
            <i-lucide name="music" class="size-4"></i-lucide>
            Canciones
          </a>
        </li>
        <li>
          <a routerLink="/autors" routerLinkActive="bg-base-300 !opacity-100"
            class="flex items-center gap-3 px-2.5 py-1.5 rounded-md font-medium opacity-75 hover:opacity-100 hover:bg-base-300 transition">
            <i-lucide name="users" class="size-4"></i-lucide>
            Autores
          </a>
        </li>
      </ul>
    </div>

    <div>
      <p class="px-2 mb-2 text-[10px] font-semibold uppercase tracking-[0.08em] opacity-50">OBS</p>
      <ul class="space-y-0.5">
        <li>
          <a routerLink="/presenter/obs-letters" routerLinkActive="bg-base-300 !opacity-100"
            class="flex items-center gap-3 px-2.5 py-1.5 rounded-md font-medium opacity-75 hover:opacity-100 hover:bg-base-300 transition">
            <i-lucide name="music" class="size-4"></i-lucide>
            Letras
          </a>
        </li>
        <li>
          <a routerLink="/presenter/obs-bible" routerLinkActive="bg-base-300 !opacity-100"
            class="flex items-center gap-3 px-2.5 py-1.5 rounded-md font-medium opacity-75 hover:opacity-100 hover:bg-base-300 transition">
            <i-lucide name="file-text" class="size-4"></i-lucide>
            Biblia
          </a>
        </li>
        <li>
          <a routerLink="/presenter/slide" routerLinkActive="bg-base-300 !opacity-100"
            class="flex items-center gap-3 px-2.5 py-1.5 rounded-md font-medium opacity-75 hover:opacity-100 hover:bg-base-300 transition">
            <i-lucide name="monitor" class="size-4"></i-lucide>
            Presentación
          </a>
        </li>
        <li>
          <a routerLink="/presenter/letter" routerLinkActive="bg-base-300 !opacity-100"
            class="flex items-center gap-3 px-2.5 py-1.5 rounded-md font-medium opacity-75 hover:opacity-100 hover:bg-base-300 transition">
            <i-lucide name="file-text" class="size-4"></i-lucide>
            Letra coro
          </a>
        </li>
      </ul>
    </div>

    <div>
      <p class="px-2 mb-2 text-[10px] font-semibold uppercase tracking-[0.08em] opacity-50">Acceso</p>
      <ul class="space-y-0.5">
        <li>
          <a routerLink="/presenter/qr-dashboard" routerLinkActive="bg-base-300 !opacity-100"
            class="flex items-center gap-3 px-2.5 py-1.5 rounded-md font-medium opacity-75 hover:opacity-100 hover:bg-base-300 transition">
            <i-lucide name="qr-code" class="size-4"></i-lucide>
            Código QR
          </a>
        </li>
      </ul>
    </div>
  </nav>
</ng-template>

<ng-template #statusTpl>
  <div class="px-4 py-3 border-t border-base-300 text-xs space-y-0.5 shrink-0">
    <div class="flex items-center gap-2">
      <span class="size-1.5 rounded-full bg-primary animate-pulse"></span>
      <span class="font-medium">Servidor activo</span>
    </div>
    @if (mServerIp() && mServerPort()) {
    <p class="opacity-50 pl-3.5 truncate font-mono text-[11px]">{{ mServerIp() }}:{{ mServerPort() }}</p>
    }
  </div>
</ng-template>
