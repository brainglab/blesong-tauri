<header class="border-b border-base-300 px-4 sm:px-6 lg:px-8 py-5 sm:py-6">
  <div class="flex items-end justify-between gap-4 flex-wrap">
    <div class="min-w-0">
      @if (eyebrow) {
        <p class="text-[11px] font-semibold uppercase tracking-[0.1em] text-primary mb-1.5">{{ eyebrow }}</p>
      }
      <h1 class="text-xl sm:text-2xl font-semibold tracking-tight leading-tight">{{ title }}</h1>
      @if (description) {
        <p class="text-sm opacity-70 mt-1.5 max-w-2xl">{{ description }}</p>
      }
    </div>
    <div class="flex items-center gap-2 shrink-0 flex-wrap">
      <ng-content />
    </div>
  </div>
</header>
